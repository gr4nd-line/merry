name: Unit Tests

on:
  workflow_dispatch:
  pull_request:
    types: [opened, reopened]
  push:
    branches:
      - main
jobs:
  build-and-unit-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.27.0
      - name: install dependencies
        run: go get .
      - name: Build
        run: go build -v ./...
      - name: Test with Go CLI
        run: go test -v ./...
